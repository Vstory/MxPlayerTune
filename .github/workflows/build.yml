name: Build

# 运行标题：多跑几次时用于辨认批次（分支 + 短号）。
run-name: "Build · ${{ github.ref_name }} · ${{ github.sha }}"

# 触发：
#   - push main → 自动构建
#   - 手动 → 同样构建（无参数）
# 每次构建都产出**两个包**（debug + release），共用同一把固定密钥，一起发进**同一个新 Release**：
#   · 两者差别 = 调试日志是否被裁掉（排障用 debug 那个；见「Gradle build」与「Verify APKs」两步）
#   · 每次构建 = 一个新 tag（`<版本>_<时间>_<短号>`）⇒ **不往固定页滚动更新**，每个版本各有独立页面
# 纯文档改动不重建（无产物价值，白耗额度）。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# 并发：串行排队，避免两次运行同时发布（tag 互不相同，这里只是避免互相拖慢与日志交错）。
# 不用 cancel-in-progress —— 中途取消可能留下半个上传状态。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 发布 Release 需要写权限

# 供应链加固：第三方 action 一律钉到 commit SHA（可变 tag 被上游改动/账号被盗后投毒的风险）。
# SHA 取自 RikkaHub-X 现役工作流（同账号、已验证可用）与 actions 官方 tag 解析值。
env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # Android SDK：项目 compileSdk=37 + buildToolsVersion=37.0.0，runner 预装镜像里没有。
      #   ⚠️ platform-37 在官方仓库里是**带小数**的名字（platforms;android-37.2），
      #   `platforms;android-37` 不存在；而 AGP 按 compileSdk=37 找的是 platforms/android-37 目录
      #   ⇒ 装完必须归位目录名（与开发机手工安装同一套做法）。
      - name: Set up Android SDK 37
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          echo "SDK=$SDK"
          echo "sdkmanager=$SDKM"

          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "build-tools;37.0.0" >/dev/null 2>&1 \
            || sudo "$SDKM" "build-tools;37.0.0" >/dev/null 2>&1 || true

          if [ ! -f "$SDK/platforms/android-37/android.jar" ]; then
            echo "安装 platform 37（手动解压 + 归位目录名）"
            curl -fsSL -o /tmp/platform-37.zip \
              "https://dl.google.com/android/repository/platform-37.2_r01.zip"
            rm -rf /tmp/p37 && mkdir -p /tmp/p37
            unzip -q /tmp/platform-37.zip -d /tmp/p37
            sudo mkdir -p "$SDK/platforms"
            sudo rm -rf "$SDK/platforms/android-37"
            sudo mv /tmp/p37/android-37.2 "$SDK/platforms/android-37"
          fi

          # 断言：缺一即在此失败，不留到 Gradle 报含糊错
          test -f "$SDK/platforms/android-37/android.jar" \
            || { echo "::error::platforms/android-37 就位失败"; exit 1; }
          test -x "$SDK/build-tools/37.0.0/aapt2" \
            || { echo "::error::build-tools 37.0.0 就位失败"; exit 1; }
          echo "platforms: $(ls "$SDK/platforms" | tr '\n' ' ')"
          echo "build-tools: $(ls "$SDK/build-tools" | tr '\n' ' ')"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compute build info
        id: info
        run: |
          NOW=$(date +%s)
          echo "short=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "ts=$(TZ=Asia/Shanghai date -d "@$NOW" +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      # 签名：从仓库 secrets 解码**固定密钥**。debug 与 release **共用同一把** —— 这样两个包能互相
      #   覆盖安装、不必卸载；而卸载会在 LSPosed 里丢掉「已启用 + 已勾作用域」的状态，是本项目
      #   反复装包时最费事的一步。
      #   secrets 名：KEY_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD
      #   ⚠️ secret 一律经 env 传入、run 脚本里**只引用变量名** —— 不把 ${{ secrets.X }} 写进 run 正文：
      #      值里若含 `$` 或反引号会被 shell 二次展开（实测口令含 $ 时被吃成前半截，且在签名报错前毫无提示）。
      #   ⚠️ 缺 secret 时**直接失败**，不回退到调试签名 —— 回退的后果是产物看着"构建成功"、
      #      签名却不对，要等安装升级时才发现。
      - name: Prepare signing (fixed key from secrets)
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for v in KEY_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 secret:$missing —— 拒绝回退到调试签名（那会让产物无法覆盖升级）"
            exit 1
          fi

          KS="$GITHUB_WORKSPACE/ci-signing.jks"
          printf '%s' "$KEY_BASE64" | base64 -d > "$KS"

          # 就地自检：解出的库能否用该口令打开、别名是否存在。
          #   否则「口令写错 / KEY_BASE64 其实是另一个库」会拖到 AGP 签名阶段才报错，且信息含糊。
          keytool -list -keystore "$KS" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::密钥库打不开或别名不存在 —— 核对 KEY_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS"; exit 1; }
          echo "已校验：密钥库可打开、别名存在"

          # storeFile 由 runner 现场拼（$GITHUB_WORKSPACE），不写死 runner 上的仓库路径名，
          # 改名/换布局都不会失配。
          {
            printf 'storeFile=%s\n' "$KS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> local.properties
          echo "已按固定密钥配置签名（debug 与 release 两个变体共用同一把）"

      - name: Gradle build
        run: |
          chmod +x gradlew
          # 两个变体都构建：release（调试日志已在编译期裁掉）+ debug（保留日志，排障用）
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug
          echo "── debug ──";   ls -la app/build/outputs/apk/debug
          echo "── release ──"; ls -la app/build/outputs/apk/release

      # 产物命名：<应用名>_<版本>_<时间>_<短号>_<变体>.apk
      #   例：MxPlayerTune_1.0.0_20260928-1851_2a36fcd7_debug.apk
      #   · 应用名取 Manifest 的 android:label，空白折成一个点 —— 与平台上传时的改名行为一致
      #     （GitHub 会把资产名里的空格改成点；本地名若保留空格，按它拼的下载链接必然 404）。
      #     在这里现读，避免「应用名」存在第二份来源、改一处忘一处。
      #   · 版本取 app/build.gradle.kts 的 versionName —— 两个包同用一个基准版本号
      #     （debug 的 versionName 实际带 -debug 后缀，那是给人看的标记，不进文件名）。
      #   · 变体在末段、**全小写**（debug / release）：两个包同批产出、同发一个 Release 页，靠它区分。
      - name: Rename APKs and assert naming rule
        env:
          TS: ${{ steps.info.outputs.ts }}
          SHORT: ${{ steps.info.outputs.short }}
        run: |
          LABEL="$(sed -nE 's/.*android:label="([^"]+)".*/\1/p' app/src/main/AndroidManifest.xml | head -1)"
          [ -n "$LABEL" ] || { echo "::error::读不到应用名（AndroidManifest 的 android:label），拒绝用空前缀给产物命名"; exit 1; }
          PREFIX="$(printf '%s' "$LABEL" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]+/./g')"
          # 折完再守一道：宁可在此失败，也不要产出一个「页面能看、链接打不开」的名字
          case "$PREFIX" in
            ""|*[!A-Za-z0-9._-]*|.*|*.)
              echo "::error::产物名前缀为空或含非法字符：'$PREFIX'（仅允许字母/数字/._-）"; exit 1 ;;
          esac

          VER="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          [ -n "$VER" ] || { echo "::error::读不到 versionName（app/build.gradle.kts），拒绝用空版本号给产物命名"; exit 1; }

          echo "产物名构成: 应用名=${PREFIX} 版本=${VER} 时间=${TS} 短号=${SHORT}"
          echo "PREFIX=${PREFIX}" >> "$GITHUB_ENV"
          echo "VER=${VER}"       >> "$GITHUB_ENV"

          mkdir -p dist
          for VARIANT in debug release; do
            SRC="app/build/outputs/apk/${VARIANT}/app-${VARIANT}.apk"
            if [ ! -f "$SRC" ]; then
              UNSIGNED="app/build/outputs/apk/${VARIANT}/app-${VARIANT}-unsigned.apk"
              if [ -f "$UNSIGNED" ]; then
                echo "::error::${VARIANT} 变体产物未签名（出现 app-${VARIANT}-unsigned.apk）—— signingConfig 没生效"
              else
                echo "::error::未找到 ${VARIANT} 变体产物：$SRC"
              fi
              exit 1
            fi
            NAME="${PREFIX}_${VER}_${TS}_${SHORT}_${VARIANT}.apk"
            cp -- "$SRC" "dist/$NAME"
            echo "产物: dist/$NAME ← $SRC"
          done

          # 命名自检（拿**实际产出的文件名**校验，不只信规则自洽）：
          #   发布与说明正文都按该规则拼文件名，改名漏改会静默错（下载 404 / 页面列错文件）
          shopt -s nullglob
          apks=(dist/*.apk)
          [ "${#apks[@]}" -eq 2 ] || { echo "::error::应产出 2 个包（debug + release），实际 ${#apks[@]} 个"; exit 1; }
          for f in "${apks[@]}"; do
            printf '%s' "$(basename "$f")" \
              | grep -qE '^[A-Za-z0-9._-]+_[A-Za-z0-9._-]+_[0-9]{8}-[0-9]{4}_[0-9a-f]{8}_(debug|release)\.apk$' \
              || { echo "::error::产物名与规则不符（或含空格/百分号等 URL 不友好字符）: $(basename "$f")"; exit 1; }
          done
          echo "✅ 命名自检通过（${#apks[@]} 个：debug + release）"
          ls -la dist

      # 断言两个包都真的可用：三件套齐全 + 变体标记正确 + **真的被固定密钥签过**。
      #   ⚠️ 为什么必须断言签名：AGP 在 signingConfig 缺失时**不报错**，而是产出 app-release-unsigned.apk；
      #   不拦就会把一个装不上的包发出去 —— 这类错误只在用户安装时暴露。
      - name: Verify APKs (xposed files + variant + signature)
        run: |
          APKSIGNER="$(command -v apksigner || true)"
          [ -n "$APKSIGNER" ] || APKSIGNER="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          [ -n "$APKSIGNER" ] || { echo "::error::找不到 apksigner，无法断言签名 —— 拒绝发布"; exit 1; }
          AAPT2="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          [ -n "$AAPT2" ] || { echo "::error::找不到 aapt2（用于读变体标记）"; exit 1; }

          # 固定密钥的证书指纹（SHA-256，大写无冒号）。**换密钥时必须同步改本行**
          # （取法：keytool -list -v 里的 SHA256，去冒号转大写）。
          EXPECTED_CERT_SHA256="52BCAA9D01539FFDB0C97D30F6C41A418CED5C42E4F77E5D284FC96E3ED13464"
          declare -A DIGEST_OF=()

          for APK in dist/*.apk; do
            NAME="$(basename "$APK")"
            # 变体取**末段**（全小写 debug / release）。
            #   用与「命名自检」**同一条完整模式**解析（而非宽松的 `.*_`）：
            #   两处都是「命名规则」的表述，宽窄不一就是漂移源；此处也严格，改规则时必然一起改。
            VARIANT="$(sed -nE 's/^[A-Za-z0-9._-]+_[A-Za-z0-9._-]+_[0-9]{8}-[0-9]{4}_[0-9a-f]{8}_(debug|release)\.apk$/\1/p' <<< "$NAME")"
            [ -n "$VARIANT" ] || { echo "::error::$NAME 不符合命名规则，无法判定变体 —— 拒绝发布"; exit 1; }
            echo "════ 校验 $NAME（变体 = $VARIANT）"

            # ① libxposed 三件套
            MISSING=""
            for e in META-INF/xposed/java_init.list META-INF/xposed/module.prop META-INF/xposed/scope.list; do
              unzip -l "$APK" | grep -q "$e" || MISSING="$MISSING $e"
            done
            [ -z "$MISSING" ] || { echo "::error::$NAME 缺 libxposed 三件套:$MISSING（LSPosed 不会识别为模块）"; exit 1; }
            echo "  ✅ META-INF/xposed 三件套齐全"

            # ② 变体标记必须与文件名一致 —— 防「两个变体弄反 / 只构建了一个」。
            #    那种错产出的包外观完全正常，只有装上才发现；而 debug 的日志正是排障唯一手段。
            BADGING="$("$AAPT2" dump badging "$APK" 2>/dev/null || true)"
            HAS_DEBUGGABLE=0
            if printf '%s' "$BADGING" | grep -q '^application-debuggable'; then HAS_DEBUGGABLE=1; fi
            if [ "$VARIANT" = "debug" ]; then
              [ "$HAS_DEBUGGABLE" -eq 1 ] || { echo "::error::$NAME 名为 debug，却没有 debuggable 标志（变体弄反？）"; exit 1; }
              printf '%s' "$BADGING" | grep -qE "versionName='[^']*-debug'" \
                || { echo "::error::$NAME 的 versionName 缺 -debug 后缀"; exit 1; }
            else
              [ "$HAS_DEBUGGABLE" -eq 0 ] || { echo "::error::$NAME 名为 release，却带 debuggable 标志（变体弄反？）"; exit 1; }
            fi
            echo "  ✅ 变体标记正确（debuggable=$HAS_DEBUGGABLE）"

            # ③ 签名有效 + 指纹等于固定密钥
            OUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"
            if printf '%s' "$OUT" | grep -qi 'DOES NOT VERIFY\|Missing.*signature\|no signature'; then
              echo "::error::$NAME 未通过签名校验 —— 拒绝发布"
              printf '%s\n' "$OUT"
              exit 1
            fi
            # 指纹行格式随 build-tools 版本变化，两种都认：
            #   旧：Signer #1 certificate SHA-256 digest: <hex>
            #   37：V2 Signer: certificate SHA-256 digest: <hex>
            # （只取第一条 SHA-256；下面还要求非空，故格式再变也只会失败在这里而不是静默放行）
            DIGEST="$(printf '%s' "$OUT" | sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-fA-F]+).*$/\1/p' | head -1)"
            [ -n "$DIGEST" ] || { echo "::error::$NAME 读不到签名证书指纹（apksigner 未能解析产物）"; printf '%s\n' "$OUT"; exit 1; }
            ACTUAL="$(printf '%s' "$DIGEST" | tr -d ':' | tr 'a-f' 'A-F')"
            if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$NAME 签名指纹与固定密钥不符 —— 拒绝发布"
              echo "  期望: $EXPECTED_CERT_SHA256"
              echo "  实际: $ACTUAL"
              echo "  排查：① 仓库 secrets 是否被清空/写错 ② 若确已轮换密钥，本处期望值需同步更新"
              exit 1
            fi
            DIGEST_OF["$VARIANT"]="$ACTUAL"
            echo "  ✅ 签名有效，指纹与固定密钥一致：$ACTUAL"

            # ④ 签名方案须为 **v2 + v3**（显式固定，不靠 AGP 默认 —— v3 默认是关的，
            #    日后改 minSdk 或升 AGP 若把它带偏，这里会拦下，而不是等装到设备上才发现）。
            VERBOSE="$("$APKSIGNER" verify --verbose "$APK" 2>&1 || true)"
            printf '%s' "$VERBOSE" | grep -qE 'Verified using v2 scheme.*: true' \
              || { echo "::error::$NAME 未启用 v2 签名方案 —— 拒绝发布"; printf '%s\n' "$VERBOSE"; exit 1; }
            printf '%s' "$VERBOSE" | grep -qE 'Verified using v3 scheme.*: true' \
              || { echo "::error::$NAME 未启用 v3 签名方案（查 app/build.gradle.kts 的 enableV3Signing）—— 拒绝发布"; printf '%s\n' "$VERBOSE"; exit 1; }
            echo "  ✅ 签名方案 v2 + v3"
          done

          # ④ 两个包必须是**同一把**签名 —— 这才是「debug 与 release 可互相覆盖安装」的前提
          #    （同包名 + 同签名 ⇒ 直接覆盖；否则 Android 会以签名不一致拒绝安装）
          [ "${DIGEST_OF[debug]}" = "${DIGEST_OF[release]}" ] \
            || { echo "::error::两个变体签名不一致（${DIGEST_OF[debug]} vs ${DIGEST_OF[release]}）—— 无法互相覆盖安装"; exit 1; }
          echo "✅ 两个变体签名一致：${DIGEST_OF[release]}"
          echo "CERT_SHA256=${DIGEST_OF[release]}" >> "$GITHUB_ENV"
          echo "SIGN_SCHEMES=v2 + v3（v1 关：minSdk 26，无需 JAR 签名）" >> "$GITHUB_ENV"

      # 发布目标：**每次构建一个新 tag**（`<版本>_<时间>_<短号>`），不往固定页滚动更新。
      #   于是每个版本各有独立页面，历史可逐页回看；页面之间靠 tag 区分。
      - name: Resolve release target
        id: target
        run: |
          TAG="${VER}_${{ steps.info.outputs.ts }}_${{ steps.info.outputs.short }}"
          echo "tag=${TAG}"                                   >> "$GITHUB_OUTPUT"
          echo "name=${VER} (${{ steps.info.outputs.ts }})" >> "$GITHUB_OUTPUT"
          echo "→ tag=${TAG}"

      - name: Generate release body
        env:
          TS: ${{ steps.info.outputs.ts }}
          SHORT: ${{ steps.info.outputs.short }}
        run: |
          cat > release_body.md <<EOF
          **MxPlayerTune** ${VER} · 提交 [\`${SHORT}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) · 构建时间（北京时间）\`${TS}\`

          本次构建产出**两个包**，两者**同一把固定密钥**签名 ⇒ 装哪个都能被下一次直接覆盖升级，**不必先卸载**（卸载会丢掉 LSPosed 里的启用状态）：

          | 包 | 调试日志 | 用途 |
          |---|---|---|
          | \`${PREFIX}_${VER}_${TS}_${SHORT}_release.apk\` | 已在编译期裁掉 | 日常使用 |
          | \`${PREFIX}_${VER}_${TS}_${SHORT}_debug.apk\` | 保留 | **排障**（看 hook 是否命中、参数与返回值） |

          - 签名证书 SHA-256：\`${CERT_SHA256:-（未读取到）}\`
          - 签名方案：\`${SIGN_SCHEMES:-（未读取到）}\`
          - 两个包**同包名**，不能同时安装（后装的覆盖先装的）
          - 目标应用：MX Player Pro \`com.mxtech.videoplayer.pro\`（作用域已静态声明，无需手动勾选）
          - 当前功能状态：**阶段 B（浏览可用）** —— 本地网络里填 `http(s)://主机:端口/路径` + 账号密码即可浏览 WebDAV 目录；
            播放与缩略图的凭据由模块内联进 URL（MX 靠它生成 Authorization 头 / 拿回端口），自签名 https 可浏览但播放取决于 MX 自带 FFmpeg
          - 构建来源：\`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\`
          EOF
          cat release_body.md

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MxPlayerTune-${{ steps.info.outputs.ts }}-${{ steps.info.outputs.short }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: ${{ steps.target.outputs.name }}
          body_path: release_body.md
          files: dist/*.apk
